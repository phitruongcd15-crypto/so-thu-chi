<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2db84b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sổ Thu Chi">
<title>Sổ Thu Chi</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f2f4f7;--card:#fff;--text:#1c2430;--muted:#7a8696;--line:#e8ecf1;--pri:#2db84b;--pri-d:#1f9a3a;--exp:#e5484d;--inc:#2a9d4a;--warn:#f59e0b;--r:14px;--shadow:0 1px 3px rgba(16,24,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#181e26;--text:#e8edf3;--muted:#8b97a6;--line:#262e38;--shadow:none;--inc:#4cc36b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;outline:none}
input:focus,select:focus{border-color:var(--pri)}
#app{max-width:640px;margin:0 auto;min-height:100%}
#hdr{position:sticky;top:0;z-index:5;background:var(--pri);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#hdr .sp{flex:1}
#hdr .ttl{font-size:18px}
.wsel{text-align:left;display:flex;flex-direction:column;line-height:1.2}
.wsel small{opacity:.9;font-size:12px}
.wsel b{font-size:20px}
.hbtn{font-size:19px;width:38px;height:38px;border-radius:50%;position:relative;display:grid;place-items:center}
.hbtn:active{background:rgba(255,255,255,.2)}
.hbtn i{position:absolute;top:2px;right:0;background:#fff;color:var(--pri-d);font:700 10px/1 sans-serif;border-radius:8px;padding:3px 4px;font-style:normal}
.spin{display:inline-block;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.srow{width:100%}
.srow input{background:rgba(255,255,255,.95);color:#1c2430;border:0}
main{padding:12px 12px 110px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.pad{padding:14px}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mnav button{width:42px;height:38px;font-size:24px;color:var(--muted)}
.mnav .mlabel{font-weight:600;font-size:16px;width:auto;flex:1;color:var(--text)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;text-align:center;padding:12px 6px}
.sum small{color:var(--muted);display:block;font-size:12px}
.sum b{font-size:14px}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.day{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--card)}
.dd{font-size:26px;font-weight:600;width:34px;text-align:center}
.dm{flex:1;line-height:1.2}.dm small{color:var(--muted);display:block}
.dn{color:var(--muted);font-size:13px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;flex:none}
.mid{flex:1;min-width:0;line-height:1.25}
.mid b{font-weight:500;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:40px 20px}
.empty i{font-size:42px;display:block;font-style:normal;margin-bottom:6px}
.seg{display:flex;background:var(--bg);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:8px;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow)}
.donutwrap{display:flex;justify-content:center;padding:6px 0}
.donut{width:210px;height:210px}
.donut .dl{fill:var(--muted);font-size:12px}.donut .dv{fill:var(--text);font-size:19px;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.pct{color:var(--muted);font-size:13px;width:46px;text-align:right}
.barsvg{width:100%;height:auto}
.barsvg text{fill:var(--muted);font-size:10px}
.bi{fill:var(--inc)}.be{fill:var(--exp)}
.legend{display:flex;gap:16px;justify-content:center;font-size:12px;color:var(--muted);padding-bottom:10px}
.legend span:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--exp)}
.legend span.i:before{background:var(--inc)}
.h2{font-weight:600;padding:12px 14px 4px}
.prog{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.prog div{height:100%;border-radius:6px;background:var(--pri)}
.prog.w div{background:var(--warn)}.prog.o div{background:var(--exp)}
.bud{padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.bud:last-child{border-bottom:0}
.bud .top{display:flex;align-items:center;gap:10px}
.bud .sub{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.btn{padding:12px 16px;border-radius:12px;background:var(--bg);font-weight:600;flex:1;text-align:center}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{background:rgba(229,72,77,.12);color:var(--exp)}
.btn.block{display:block;width:100%;margin-top:10px;flex:none}
.btns{display:flex;gap:10px;margin-top:16px}
.link{padding:14px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line);width:100%;text-align:left}
.link:last-child{border-bottom:0}
.link i{font-style:normal;font-size:20px;width:26px;text-align:center}
.big{font-size:26px;font-weight:700}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:640px;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--muted);font-size:11px;padding:4px 0}
nav button i{font-style:normal;font-size:20px;filter:grayscale(1);opacity:.7}
nav button.on{color:var(--pri-d);font-weight:600}
nav button.on i{filter:none;opacity:1}
nav .fab{width:58px;height:58px;border-radius:50%;background:var(--pri);color:#fff;font-size:32px;margin:-24px auto 0;box-shadow:0 4px 12px rgba(45,184,75,.5);display:grid;place-items:center;padding:0;filter:none}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.overlay.c{z-index:30;align-items:center;padding:20px}
.sheet{background:var(--card);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 16px calc(18px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.shead{position:sticky;top:0;background:var(--card);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;font-size:17px;z-index:2}
.shead button{font-size:20px;color:var(--muted);width:32px;height:32px}
.dlg{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:340px}
.dlg p{margin:0 0 4px}
label{display:block;font-size:12.5px;color:var(--muted);margin:12px 0 5px}
.amtbox{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding-right:8px}
.amtbox input{border:0;font-size:26px;font-weight:700;background:none}
.amtbox span{color:var(--muted);font-size:20px}
.amtbox button{background:var(--card);border-radius:8px;padding:7px 10px;font-weight:600;font-size:13px}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1.5px solid transparent;background:var(--bg);font-size:11.5px;text-align:center;line-height:1.2}
.cat i{font-style:normal;font-size:22px}
.cat.on{border-color:var(--pri);background:rgba(45,184,75,.12)}
.cat span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.presets button{width:38px;height:38px;border-radius:10px;background:var(--bg);font-size:20px}
.presets button.on{outline:2px solid var(--pri)}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1c2430;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88%;text-align:center}
#toast.show{opacity:.96}
.note{font-size:12.5px;color:var(--muted);margin-top:8px}
.catbtn{display:flex;align-items:center;gap:10px;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;text-align:left}
.catbtn i{font-style:normal;font-size:20px}.catbtn span{flex:1}.catbtn .ph{color:var(--muted)}.catbtn em{font-style:normal;color:var(--muted)}
.overlay.p{z-index:25}
.sheet.tall{height:92vh}
.crow{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;text-align:left;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}.crow.kid{padding-left:36px}.crow.on{color:var(--pri-d);font-weight:600}
.crow:active{background:var(--bg)}
.sub2{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);padding:2px 0 2px 22px}
.pchips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;padding:2px 0}
.pchips button{flex:none;padding:7px 14px;border-radius:18px;background:var(--card);box-shadow:var(--shadow);font-size:14px;color:var(--muted)}
.pchips button.on{background:var(--pri);color:#fff;font-weight:600}
.dates{display:flex;gap:8px;margin-bottom:10px}.dates input{flex:1}
.kv{display:flex;justify-content:space-between;align-items:center;padding:6px 0;font-size:14px}.kv>span:first-child{color:var(--muted)}
.net{font-size:26px;font-weight:700;margin-top:2px}
.cmp{font-size:12.5px;margin:-4px 0 8px}
.hb{height:8px;border-radius:5px;margin:2px 0 10px;min-width:3px}.hb.i{background:var(--inc)}.hb.e{background:var(--exp)}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dcol{text-align:center;cursor:pointer;padding:4px 2px;border-radius:12px}.dcol:active{background:var(--bg)}
.donut.mini{width:130px;height:130px}
.lg{display:flex;align-items:center;gap:6px;font-size:12px;text-align:left;margin-top:3px}
.bsel{fill:rgba(128,128,128,.16)}.bline{stroke:var(--pri);stroke-width:2}.barea{fill:rgba(45,184,75,.15)}.bdot{fill:var(--pri)}
.cap{text-align:center;font-size:12.5px;color:var(--muted);min-height:18px}
.sum.s2{grid-template-columns:1fr 1fr;margin-top:-4px}
.rg{border-bottom:1px solid var(--line)}.rg:last-child{border-bottom:0}.rg .row{border-bottom:0}
</style>
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <main id="main"></main>
</div>
<nav id="nav"></nav>
<div id="toast"></div>

<script>
/* Khi chạy trong Apps Script, dòng dưới được thay bằng URL Web App; khi host tĩnh thì giữ nguyên (và bị bỏ qua). */
const SERVER_URL = "<?!= ScriptApp.getService().getUrl() ?>";
const AUTO_URL = /^https:\/\//.test(SERVER_URL) ? SERVER_URL : '';

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('vi-VN');
const money = n => nf.format(Math.round(n || 0)) + ' ₫';
const short = n => { const a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 1e9 ? +(a/1e9).toFixed(2) + ' tỷ' : a >= 1e6 ? +(a/1e6).toFixed(1) + ' tr' : a >= 1e3 ? +(a/1e3).toFixed(0) + 'k' : a); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = d => String(d).slice(0, 7);
const shiftMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthLabel = m => { const [y, mo] = m.split('-'); return `Tháng ${+mo}/${y}`; };
const WD = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const PAL = ['#2db84b','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899','#64748b'];
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const ls = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- trạng thái ---------- */
const S = {
  cfg: ls('sc_cfg', { url: '', key: '' }),
  data: ls('sc_data', { wallets: [], categories: [], transactions: [], budgets: [] }),
  queue: ls('sc_queue', []),
  view: 'tx', month: todayStr().slice(0, 7), wallet: 'all', q: '', searchOpen: false,
  rp: { type: 'month', anchor: todayStr(), from: '', to: '' }, rbk: null, sync: 'idle', syncMsg: ''
};
if (!S.cfg.url && AUTO_URL) S.cfg.url = AUTO_URL;
(function () { /* link cài nhanh: #url=...&key=... */
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('url') || h.get('key')) {
    if (h.get('url')) S.cfg.url = h.get('url');
    if (h.get('key')) S.cfg.key = h.get('key');
    save('sc_cfg', S.cfg);
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
})();
const configured = () => !!(S.cfg.url && S.cfg.key);
const KEY = { Wallets: 'wallets', Categories: 'categories', Transactions: 'transactions', Budgets: 'budgets' };
const W = id => S.data.wallets.find(w => w.id === id);
const C = id => S.data.categories.find(c => c.id === id);
const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').toLowerCase();
const parentOf = c => (c && c.parentId) ? C(c.parentId) : null;
const kidsOf = id => S.data.categories.filter(c => c.parentId === id);
const rootsOf = type => S.data.categories.filter(c => c.type === type && !parentOf(c));
const inCat = (t, id) => t.categoryId === id || (C(t.categoryId) || {}).parentId === id;

function balances() {
  const b = {};
  S.data.wallets.forEach(w => b[w.id] = +w.initial || 0);
  S.data.transactions.forEach(t => {
    const a = +t.amount || 0;
    if (t.type === 'income') { if (t.walletId in b) b[t.walletId] += a; }
    else if (t.type === 'expense') { if (t.walletId in b) b[t.walletId] -= a; }
    else { if (t.walletId in b) b[t.walletId] -= a; if (t.toWalletId in b) b[t.toWalletId] += a; }
  });
  return b;
}
const totalBal = () => Object.values(balances()).reduce((s, v) => s + v, 0);

function inScope(t) { return S.wallet === 'all' || t.walletId === S.wallet || t.toWalletId === S.wallet; }
function txs(m, scope = true) {
  return S.data.transactions.filter(t => monthOf(t.date) === m && (!scope || inScope(t)));
}
function searchAll() {
  const s = S.q.toLowerCase();
  return S.data.transactions.filter(t => inScope(t) && ((t.note || '') + ' ' + (C(t.categoryId)?.name || '')).toLowerCase().includes(s));
}
const sortTx = (a, b) => b.date.localeCompare(a.date) || String(b.createdAt).localeCompare(String(a.createdAt));

/* ---------- ghi dữ liệu + hàng đợi đồng bộ ---------- */
function put(sheet, row, quiet) {
  const a = S.data[KEY[sheet]], i = a.findIndex(x => x.id === row.id);
  i >= 0 ? a[i] = row : a.push(row);
  S.queue.push({ op: 'upsert', sheet, row });
  if (!quiet) commit();
}
function del(sheet, id, quiet) {
  const k = KEY[sheet];
  S.data[k] = S.data[k].filter(x => x.id !== id);
  S.queue.push({ op: 'remove', sheet, id });
  if (!quiet) commit();
}
function commit() { save('sc_data', S.data); save('sc_queue', S.queue); render(); flush(); }

let busy = false;
async function api(action, extra) {
  let res;
  try {
    res = await fetch(S.cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ key: S.cfg.key, action, ...extra }) });
  } catch (e) { throw new Error('Không kết nối được máy chủ'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('Phản hồi không hợp lệ – kiểm tra Web App đã đặt quyền "Anyone"'); }
  if (!j.ok) throw new Error(j.error || 'Lỗi không xác định');
  return j;
}
async function pushQueue() {
  while (S.queue.length) {
    const n = Math.min(S.queue.length, 40);
    await api('batch', { ops: S.queue.slice(0, n) });
    S.queue.splice(0, n); save('sc_queue', S.queue); setSync('syncing');
  }
}
async function flush() {
  if (busy || !S.queue.length || !configured() || !navigator.onLine) return;
  busy = true; setSync('syncing');
  try { await pushQueue(); setSync('ok'); } catch (e) { setSync('error', e.message); if (/mã truy cập/.test(e.message)) toast(e.message); }
  busy = false;
  if (S.queue.length && S.sync !== 'error') flush();
}
async function pull(manual) {
  if (!configured() || busy) return;
  busy = true; setSync('syncing');
  try {
    await pushQueue();
    const j = await api('bootstrap');
    if (!S.queue.length) { S.data = j.data; save('sc_data', S.data); render(); }
    setSync('ok');
    if (manual) toast('Đã đồng bộ ✓');
  } catch (e) { setSync('error', e.message); if (manual) toast(e.message); if (/mã truy cập/.test(e.message)) settingsSheet(); }
  busy = false;
  if (S.queue.length && S.sync !== 'error') flush();
}
function setSync(s, msg) {
  S.sync = s; S.syncMsg = msg || '';
  const b = $('#syncbtn'); if (b) b.innerHTML = syncHTML();
}
function syncHTML() {
  const p = S.queue.length;
  const ic = S.sync === 'syncing' ? '<span class="spin">⟳</span>' : S.sync === 'error' ? '⚠️' : (p ? '☁️' : '✓');
  return ic + (p ? `<i>${p}</i>` : '');
}

/* ---------- giao diện: khung ---------- */
const TITLES = { report: 'Báo cáo', budget: 'Ngân sách', acct: 'Tài khoản' };
function render() {
  if (S.wallet !== 'all' && !W(S.wallet)) S.wallet = 'all';
  renderHeader(); renderMain(); renderNav();
}
function renderMain() { $('#main').innerHTML = ({ tx: viewTx, report: viewReport, budget: viewBudget, acct: viewAcct })[S.view](); }
function renderHeader() {
  const sync = `<button id="syncbtn" class="hbtn" data-act="sync">${syncHTML()}</button>`;
  if (S.view === 'tx' || S.view === 'report') {
    const bal = S.wallet === 'all' ? totalBal() : (balances()[S.wallet] || 0);
    const name = S.wallet === 'all' ? 'Tất cả ví' : W(S.wallet).name;
    $('#hdr').innerHTML = `<button class="wsel" data-act="pickWallet"><small>${esc(name)} ▾</small><b>${money(bal)}</b></button><span class="sp"></span>${S.view === 'tx' ? '<button class="hbtn" data-act="search">🔍</button>' : ''}${sync}` +
      (S.view === 'tx' && S.searchOpen ? `<div class="srow"><input id="q" placeholder="Tìm theo ghi chú, danh mục…" value="${esc(S.q)}"></div>` : '');
    if (S.view === 'tx' && S.searchOpen) { const q = $('#q'); q && q.focus(); }
  } else {
    $('#hdr').innerHTML = `<b class="ttl">${TITLES[S.view]}</b><span class="sp"></span>${sync}`;
  }
}
function renderNav() {

/* ---------- tab: giao dịch ---------- */

/* ---------- khoảng thời gian & số dư ---------- */
const D = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const ds = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (s, n) => { const d = D(s); d.setDate(d.getDate() + n); return ds(d); };
const addMonths = (s, n) => { const d = D(s); d.setDate(1); d.setMonth(d.getMonth() + n); return ds(d); };
const lastDay = (y, m) => new Date(y, m, 0).getDate();
const dmy = s => { const [y, m, d] = s.split('-'); return `${d}/${m}/${y}`; };
const dm = s => { const [, m, d] = s.split('-'); return `${d}/${m}`; };
const daysBetween = (a, b) => Math.round((D(b) - D(a)) / 86400000) + 1;
const WDS = ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'];
const PTYPES = [['week', 'Tuần'], ['month', 'Tháng'], ['quarter', 'Quý'], ['year', 'Năm'], ['custom', 'Tùy chọn']];

function prange(p) {
  const a = D(p.anchor), y = a.getFullYear(), m = a.getMonth() + 1;
  if (p.type === 'week') { const f = addDays(p.anchor, -((a.getDay() + 6) % 7)), t = addDays(f, 6); return { from: f, to: t, label: `${dm(f)} – ${dmy(t)}` }; }
  if (p.type === 'quarter') { const q = Math.floor((m - 1) / 3), m0 = q * 3 + 1; return { from: `${y}-${pad(m0)}-01`, to: `${y}-${pad(m0 + 2)}-${pad(lastDay(y, m0 + 2))}`, label: `Quý ${q + 1}/${y}` }; }
  if (p.type === 'year') return { from: `${y}-01-01`, to: `${y}-12-31`, label: `Năm ${y}` };
  if (p.type === 'custom') { const f = p.from || todayStr(), t = p.to && p.to >= f ? p.to : f; return { from: f, to: t, label: `${dm(f)} – ${dmy(t)}` }; }
  return { from: `${y}-${pad(m)}-01`, to: `${y}-${pad(m)}-${pad(lastDay(y, m))}`, label: `Tháng ${m}/${y}` };
}
function pshift(p, k) {
  const n = { ...p };
  if (p.type === 'week') n.anchor = addDays(p.anchor, 7 * k);
  else if (p.type === 'month') n.anchor = addMonths(p.anchor, k);
  else if (p.type === 'quarter') n.anchor = addMonths(p.anchor, 3 * k);
  else if (p.type === 'year') n.anchor = addMonths(p.anchor, 12 * k);
  else { const r = prange(p), len = daysBetween(r.from, r.to); n.from = addDays(r.from, len * k); n.to = addDays(r.to, len * k); }
  return n;
}
const rangeTx = (f, t) => S.data.transactions.filter(x => x.date >= f && x.date <= t && inScope(x));
function sumTx(l) { let inc = 0, exp = 0; l.forEach(t => { if (t.type === 'income') inc += +t.amount; else if (t.type === 'expense') exp += +t.amount; }); return { inc, exp }; }
function delta(t) {
  const a = +t.amount || 0;
  if (S.wallet === 'all') return t.type === 'income' ? a : t.type === 'expense' ? -a : 0;
  const w = S.wallet;
  if (t.type === 'income') return t.walletId === w ? a : 0;
  if (t.type === 'expense') return t.walletId === w ? -a : 0;
  return (t.walletId === w ? -a : 0) + (t.toWalletId === w ? a : 0);
}
const scopeInit = () => S.wallet === 'all' ? S.data.wallets.reduce((s, w) => s + (+w.initial || 0), 0) : (+(W(S.wallet) || {}).initial || 0);
const balAt = d => scopeInit() + S.data.transactions.reduce((s, t) => t.date <= d ? s + delta(t) : s, 0);

function makeBuckets(r, type) {
  const n = daysBetween(r.from, r.to), out = [], push = (f, t, label) => out.push({ from: f, to: t, label });
  if (type !== 'quarter' && type !== 'year' && n <= 14) {
    for (let i = 0; i < n; i++) { const d = addDays(r.from, i); push(d, d, n <= 7 ? WDS[D(d).getDay()] : String(+d.slice(8))); }
  } else if (type !== 'quarter' && type !== 'year' && n <= 100) {
    for (let f = r.from, i = 1; f <= r.to; f = addDays(f, 7), i++) { const e = addDays(f, 6); push(f, e > r.to ? r.to : e, n <= 35 ? `Tuần ${i}` : dm(f)); }
  } else {
    let f = r.from;
    while (f <= r.to) { const d = D(f), e = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(lastDay(d.getFullYear(), d.getMonth() + 1))}`; push(f, e > r.to ? r.to : e, `T${d.getMonth() + 1}`); f = addMonths(f, 1); }
  }
  return out.map(b => { const s = sumTx(rangeTx(b.from, b.to)); return { ...b, inc: s.inc, exp: s.exp, bal: balAt(b.to) }; });
}

/* ---------- nhóm danh mục ---------- */
const groupOf = t => { const c = C(t.categoryId); return c ? (parentOf(c) ? parentOf(c).id : c.id) : ''; };
function catGroups(list) {
  const g = {};
  list.forEach(t => { const gid = groupOf(t), o = g[gid] = g[gid] || { id: gid, v: 0, subs: {} }; o.v += +t.amount; o.subs[t.categoryId || ''] = (o.subs[t.categoryId || ''] || 0) + +t.amount; });
  return Object.values(g).sort((a, b) => b.v - a.v);
}
const truncRows = rows => rows.length > 8 ? rows.slice(0, 7).concat([{ id: '__other', v: rows.slice(7).reduce((s, r) => s + r.v, 0), subs: {} }]) : rows;
const gname = id => id === '__other' ? 'Khác' : (C(id) ? C(id).name : 'Chưa phân loại');
const gicon = id => id === '__other' ? '…' : (C(id) ? C(id).icon : '❓');

/* ---------- biểu đồ ---------- */
function donut(rows, total, cls) {
  const R = 70, Cc = 2 * Math.PI * R; let off = 0;
  const segs = rows.map((r, i) => { const len = r.v / total * Cc; const s = `<circle r="${R}" cx="100" cy="100" fill="none" stroke="${PAL[i % PAL.length]}" stroke-width="28" stroke-dasharray="${len} ${Cc - len}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += len; return s; }).join('');
  const svg = `<svg viewBox="0 0 200 200" class="donut ${cls || ''}">${segs}<text x="100" y="96" text-anchor="middle" class="dl">Tổng</text><text x="100" y="118" text-anchor="middle" class="dv">${short(total)}</text></svg>`;
  return cls ? svg : `<div class="donutwrap">${svg}</div>`;
}
function bucketLabels(bk, gw, y) {
  const every = Math.ceil(bk.length / 8);
  return bk.map((b, i) => i % every === 0 ? `<text x="${i * gw + gw / 2}" y="${y}" text-anchor="middle">${esc(b.label)}</text>` : '').join('');
}
function trendChart(bk) {
  const n = bk.length, gw = 320 / n, bw = Math.min(14, gw / 2.6), H = 105;
  const max = Math.max(1, ...bk.map(b => Math.max(b.inc, b.exp)));
  const g = bk.map((b, i) => {
    const x = i * gw + gw / 2, hi = b.inc / max * H, he = b.exp / max * H;
    return `<g data-act="bk" data-i="${i}">${S.rbk === i ? `<rect class="bsel" x="${i * gw + 1}" y="0" width="${gw - 2}" height="${H + 16}" rx="4"/>` : ''}<rect fill="transparent" x="${i * gw}" y="0" width="${gw}" height="${H + 18}"/><rect class="bi" x="${x - bw - 1}" y="${H - hi + 8}" width="${bw}" height="${hi}" rx="2"/><rect class="be" x="${x + 1}" y="${H - he + 8}" width="${bw}" height="${he}" rx="2"/></g>`;
  }).join('');
  return `<svg viewBox="0 0 320 136" class="barsvg">${g}${bucketLabels(bk, gw, 130)}</svg>`;
}
function balChart(bk) {
  const n = bk.length, gw = 320 / n, vals = bk.map(b => b.bal), min = Math.min(...vals), max = Math.max(...vals), span = max - min || 1;
  const pts = vals.map((v, i) => [i * gw + gw / 2, 14 + (1 - (v - min) / span) * 74]);
  const line = pts.map(q => q.join(',')).join(' ');
  const dots = pts.map(q => `<circle class="bdot" cx="${q[0]}" cy="${q[1]}" r="3"/>`).join('');
  const lab = `<text x="4" y="10" text-anchor="start">${short(max)}</text><text x="4" y="104" text-anchor="start">${short(min)}</text>`;
  return `<svg viewBox="0 0 320 136" class="barsvg"><polygon class="barea" points="${pts[0][0]},96 ${line} ${pts[n - 1][0]},96"/><polyline class="bline" fill="none" points="${line}"/>${dots}${lab}${bucketLabels(bk, gw, 130)}</svg>`;
}
function cmp(cur, prev, upGood) {
  if (!prev) return cur ? '<div class="cmp" style="color:var(--muted)">Kỳ trước: 0 ₫</div>' : '';
  const pc = (cur - prev) / prev * 100, good = (pc >= 0) === upGood;
  return `<div class="cmp" style="color:var(--${good ? 'inc' : 'exp'})">${pc >= 0 ? '▲' : '▼'} ${Math.abs(pc).toFixed(0)}% so với kỳ trước (${money(prev)})</div>`;
}

/* ---------- tab: báo cáo ---------- */
function viewReport() {
  const p = S.rp, r = prange(p), list = rangeTx(r.from, r.to), { inc, exp } = sumTx(list);
  const pr = prange(pshift(p, -1)), ps = sumTx(rangeTx(pr.from, pr.to));
  const net = inc - exp, tot = inc + exp || 1;
  let h = `<div class="pchips">${PTYPES.map(([k, l]) => `<button class="${p.type === k ? 'on' : ''}" data-act="rPer" data-v="${k}">${l}</button>`).join('')}</div>`;
  h += p.type === 'custom'
    ? `<div class="dates"><input type="date" id="rp_f" value="${r.from}"><input type="date" id="rp_t" value="${r.to}"></div>`

  h += `<div class="card pad"><div class="kv"><span>Số dư đầu</span><b>${money(balAt(addDays(r.from, -1)))}</b></div><div class="kv"><span>Số dư cuối</span><b>${money(balAt(r.to))}</b></div></div>`;

  h += `<div class="card pad"><b>Thu nhập ròng</b><div class="net ${net < 0 ? 'exp' : 'inc'}">${net > 0 ? '+' : ''}${money(net)}</div>
    <div class="kv" style="margin-top:8px"><span>Khoản thu</span><b class="inc">${money(inc)}</b></div><div class="hb i" style="width:${inc / tot * 100}%"></div>${cmp(inc, ps.inc, true)}
    <div class="kv"><span>Khoản chi</span><b class="exp">${money(exp)}</b></div><div class="hb e" style="width:${exp / tot * 100}%"></div>${cmp(exp, ps.exp, false)}</div>`;

  };

    <div class="kv"><span>Ngày chi nhiều nhất</span><b>${top ? dm(top[0]) + ' · ' + money(top[1]) : '—'}</b></div>
    <div class="kv"><span>Tỷ lệ tiết kiệm</span><b>${inc > 0 ? Math.round(net / inc * 100) + '%' : '—'}</b></div>
    <div class="kv"><span>Số giao dịch</span><b>${list.length}</b></div></div>`;

  const topTx = list.filter(t => t.type === 'expense').sort((a, b) => b.amount - a.amount).slice(0, 5);

/* ---------- chi tiết nhóm → giao dịch ---------- */

/* ---------- tab: ngân sách ---------- */

      const spent = list.filter(t => !b.categoryId || inCat(t, b.categoryId)).reduce((s, t) => s + +t.amount, 0);
      const lim = +b.amount || 0, pct = lim ? spent / lim * 100 : 0, rest = lim - spent, c = C(b.categoryId);
      const cls = pct >= 100 ? 'o' : pct >= 80 ? 'w' : '';
      const tip = rest < 0 ? `Vượt ${money(-rest)}` : `Còn ${money(rest)}` + (isCur && left ? ` · nên chi ≤ ${money(rest / left)}/ngày` : '');
      return `<div class="bud" data-act="editBudget" data-id="${esc(b.id)}"><div class="top"><div class="ico" style="background:var(--bg)">${b.categoryId ? esc(c ? c.icon : '❓') : '💼'}</div><div class="mid"><b>${b.categoryId ? esc(c ? c.name : 'Chưa phân loại') : 'Tổng chi tiêu'}</b><small>${money(spent)} / ${money(lim)}</small></div><div class="amt">${Math.round(pct)}%</div></div><div class="prog ${cls}"><div style="width:${Math.min(100, pct)}%"></div></div><div class="sub"><span class="${rest<0?'exp':''}">${tip}</span></div></div>`;
    }).join('') + `</div>`;
  }
  return h + `<button class="btn pri block" data-act="addBudget">＋ Thêm ngân sách</button>`;
}

/* ---------- sheet / dialog ---------- */
function openSheet(title, body, dismiss = true) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet"><div class="shead"><b>${title}</b>${dismiss ? '<button data-act="close">✕</button>' : ''}</div><div class="sbody">${body}</div></div>`;
  o.addEventListener('click', e => { if (e.target === o && dismiss) closeSheet(); });
  document.body.appendChild(o);
  return o.querySelector('.sbody');
}
function closeSheet() { document.querySelectorAll('.overlay:not(.c)').forEach(o => o.remove()); }
function ask(msg, ok = 'Xóa') {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay c';
    o.innerHTML = `<div class="dlg"><p>${esc(msg)}</p><div class="btns"><button class="btn" data-r="0">Hủy</button><button class="btn danger" data-r="1">${esc(ok)}</button></div></div>`;
    o.onclick = e => { const r = e.target.dataset.r; if (r !== undefined || e.target === o) { o.remove(); res(r === '1'); } };
    document.body.appendChild(o);
  });
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
const digits = v => String(v).replace(/\D/g, '');
const parseNum = (v, neg) => { const n = +digits(v) || 0; return neg && /^\s*-/.test(v) ? -n : n; };
const fmtNum = n => n ? nf.format(n) : '';

function pickCat(type, cur, cb) {
  const o = document.createElement('div'); o.className = 'overlay p';
  o.innerHTML = `<div class="sheet tall"><div class="shead"><b>Chọn nhóm</b><button data-x="1">✕</button></div><input id="pc_q" placeholder="Tìm kiếm" autocomplete="off"><div id="pc_l"></div></div>`;
  const row = (c, kid) => `<button type="button" class="crow ${kid ? 'kid' : ''} ${c.id === cur ? 'on' : ''}" data-id="${esc(c.id)}"><span class="ico" style="background:hsl(${hue(c.id)} 65% 50% / .18);width:34px;height:34px;font-size:17px">${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`;
  const draw = q => {
    const n = norm(q); let h = '';
    rootsOf(type).forEach(r => {
      const rm = !n || norm(r.name).includes(n), km = kidsOf(r.id).filter(k => rm || norm(k.name).includes(n));
      if (rm || km.length) h += `<div class="card" style="margin:10px 0 0">${row(r, false)}${km.map(k => row(k, true)).join('')}</div>`;
    });
    o.querySelector('#pc_l').innerHTML = h || '<div class="empty">Không có danh mục</div>';
  };
  o.onclick = e => {
    if (e.target === o || e.target.closest('[data-x]')) return o.remove();
    const b = e.target.closest('.crow'); if (b) { o.remove(); cb(b.dataset.id); }
  };
  o.addEventListener('input', e => { if (e.target.id === 'pc_q') draw(e.target.value); });
  document.body.appendChild(o); draw('');
  setTimeout(() => { const el = o.querySelector('.crow.on'); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
}
function catRow(c, kid) {
  return `<div class="row" data-act="editCat" data-id="${esc(c.id)}" style="padding-left:${kid ? 30 : 0}px;padding-right:0"><div class="ico" style="background:hsl(${hue(c.id)} 65% 50% / .18)">${esc(c.icon)}</div><div class="mid"><b>${esc(c.name)}</b></div><span style="color:var(--muted)">›</span></div>`;
}

  const rows = [['Ngày', 'Loại', 'Danh mục', 'Ví', 'Ví đến', 'Số tiền', 'Ghi chú']];
  const L = { expense: 'Chi tiêu', income: 'Thu nhập', transfer: 'Chuyển khoản' };
  [...S.data.transactions].sort(sortTx).forEach(t => rows.push([t.date, L[t.type], C(t.categoryId)?.name || '', W(t.walletId)?.name || '', W(t.toWalletId)?.name || '', t.amount, t.note || '']));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `so-thu-chi-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã xuất CSV');
}

/* ---------- điều phối sự kiện ---------- */
const ACT = {
  tab: el => { S.view = el.dataset.v; S.searchOpen = false; S.q = ''; S.rbk = null; render(); window.scrollTo(0, 0); },
  addTx: () => txForm(),
  editTx: el => txForm(el.dataset.id),
  mPrev: () => { S.month = shiftMonth(S.month, -1); renderMain(); },
  mNext: () => { S.month = shiftMonth(S.month, 1); renderMain(); },
  mNow: () => { S.month = todayStr().slice(0, 7); renderMain(); },
  pickWallet, setWallet: el => { S.wallet = el.dataset.id; closeSheet(); render(); },
  search: () => { S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.q = ''; renderHeader(); renderMain(); },
  sync: () => configured() ? pull(true) : settingsSheet(true),
  close: closeSheet,
  rPer: el => { const t = el.dataset.v, r = prange(S.rp); S.rp = { ...S.rp, type: t }; if (t === 'custom') { S.rp.from = r.from; S.rp.to = r.to; } S.rbk = null; renderMain(); },
  rPrev: () => { S.rp = pshift(S.rp, -1); S.rbk = null; renderMain(); },
  rNext: () => { S.rp = pshift(S.rp, 1); S.rbk = null; renderMain(); },
  rNow: () => { S.rp = { ...S.rp, anchor: todayStr() }; S.rbk = null; renderMain(); },
  bk: el => { const i = +el.dataset.i; S.rbk = S.rbk === i ? null : i; renderMain(); },
  catRep: el => catReport(el.dataset.v),
  catTx: el => catTxList(el.dataset.v, el.dataset.m),
  addWallet: () => walletForm(), editWallet: el => walletForm(el.dataset.id),
  cats: catList, addCat: () => catForm(), editCat: el => catForm(el.dataset.id),
  addBudget: () => budgetForm(), editBudget: el => budgetForm(el.dataset.id),
  export: exportCsv, settings: () => settingsSheet()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; renderMain(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'rp_f' || e.target.id === 'rp_t') {
    S.rp[e.target.id === 'rp_f' ? 'from' : 'to'] = e.target.value;
    if (S.rp.to && S.rp.from && S.rp.to < S.rp.from) S.rp.to = S.rp.from;
    S.rbk = null; renderMain();
  }
});

/* ---------- khởi động ---------- */
render();
if (!configured()) settingsSheet(true); else pull();
addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (!document.hidden && configured()) pull(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/googleusercontent|script\.google/.test(location.host)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
