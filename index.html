<script>
/* Khi chạy trong Apps Script, dòng dưới được thay bằng URL Web App; khi host tĩnh thì giữ nguyên (và bị bỏ qua). */
const SERVER_URL = "<?!= ScriptApp.getService().getUrl() ?>";
const AUTO_URL = /^https:\/\//.test(SERVER_URL) ? SERVER_URL : '';

/* ---------- tiện ích ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('vi-VN');
const enf = new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
let FMT = 'vi';
const num = n => FMT === 'en' ? enf.format(n || 0) : nf.format(Math.round(n || 0));
const money = n => num(n) + (FMT === 'en' ? ' đ' : ' ₫');
const short = n => { const a = Math.abs(n); return (n < 0 ? '-' : '') + (a >= 1e9 ? +(a/1e9).toFixed(2) + ' tỷ' : a >= 1e6 ? +(a/1e6).toFixed(1) + ' tr' : a >= 1e3 ? +(a/1e3).toFixed(0) + 'k' : a); };
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const monthOf = d => String(d).slice(0, 7);
const shiftMonth = (m, k) => { const [y, mo] = m.split('-').map(Number); const d = new Date(y, mo - 1 + k, 1); return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; };
const monthLabel = m => { const [y, mo] = m.split('-'); return `Tháng ${+mo}/${y}`; };
const WD = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
const PAL = ['#2db84b','#3b82f6','#f59e0b','#ef4444','#8b5cf6','#14b8a6','#ec4899','#64748b'];
const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };
const ls = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
FMT = ls('sc_fmt', 'vi');

/* ---------- trạng thái ---------- */
const S = {
  cfg: ls('sc_cfg', { url: '', key: '' }),
  data: ls('sc_data', { wallets: [], categories: [], transactions: [], budgets: [] }),

  const every = Math.ceil(n / 12);

  return `<svg viewBox="0 0 ${Wd} ${T + H + B}" class="barsvg">${g}</svg>`;
}

const topPage = () => S.pages[S.pages.length - 1];
function pushPage(p) {

  renderPage();
}
function popPage() {
  if (!S.pages.length) return;

  const L = S.pages.length;

  setTimeout(() => { if (S.pages.length === L) { S.pages.pop(); renderPage(); } }, 300);
}

  const L = S.pages.length;

  setTimeout(() => { if (S.pages.length === L) { S.pages = []; renderPage(); } }, 300);
}
addEventListener('popstate', e => { const n = (e.state && e.state.sc) || 0; if (n < S.pages.length) { S.pages.length = n; renderPage(); } });

function dayCards(list) {
  const g = {}; list.forEach(t => (g[t.date] = g[t.date] || []).push(t));
  return Object.keys(g).sort().reverse().map(d => {
    const [y, m, dd] = d.split('-').map(Number), wd = WD[new Date(y, m - 1, dd).getDay()];
    let net = 0; g[d].forEach(t => { if (t.type === 'income') net += +t.amount; else if (t.type === 'expense') net -= +t.amount; });
    return `<div class="card"><div class="day"><div class="dd">${dd}</div><div class="dm"><b>${wd}</b><small>tháng ${m} ${y}</small></div><div class="dn">${net > 0 ? '+' : ''}${money(net)}</div></div>${g[d].map(txRow).join('')}</div>`;
  }).join('');
}

function viewBudget() {

      const cls = pct >= 100 ? 'o' : pct >= 80 ? 'w' : '';
      const tip = rest < 0 ? `Vượt ${money(-rest)}` : `Còn ${money(rest)}` + (isCur && left ? ` · nên chi ≤ ${money(rest / left)}/ngày` : '');

/* ---------- sheet / dialog ---------- */
function openSheet(title, body, dismiss = true) {
  closeSheet();
  const o = document.createElement('div'); o.className = 'overlay';
  o.innerHTML = `<div class="sheet"><div class="shead"><b>${title}</b>${dismiss ? '<button data-act="close">✕</button>' : ''}</div><div class="sbody">${body}</div></div>`;
  o.addEventListener('click', e => { if (e.target === o && dismiss) closeSheet(); });
  document.body.appendChild(o);
  return o.querySelector('.sbody');
}
function closeSheet() { document.querySelectorAll('.overlay:not(.c)').forEach(o => o.remove()); }
function ask(msg, ok = 'Xóa') {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay c';
    o.innerHTML = `<div class="dlg"><p>${esc(msg)}</p><div class="btns"><button class="btn" data-r="0">Hủy</button><button class="btn danger" data-r="1">${esc(ok)}</button></div></div>`;
    o.onclick = e => { const r = e.target.dataset.r; if (r !== undefined || e.target === o) { o.remove(); res(r === '1'); } };
    document.body.appendChild(o);
  });
}
let tt;
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }
const digits = v => String(v).replace(/\D/g, '');
const parseNum = (v, neg) => { const n = +digits(v) || 0; return neg && /^\s*-/.test(v) ? -n : n; };
const fmtNum = n => n ? nf.format(n) : '';

    if (el.dataset.t) {

      if (S.view === 'tx' && !S.searchOpen) S.month = monthOf(f.date);
      put('Transactions', row); closeSheet(); toast('Đã lưu ✓');
    }
  };
  draw();
}

/* ---------- danh mục ---------- */
function pickCat(type, cur, cb) {
  const o = document.createElement('div'); o.className = 'overlay p';
  o.innerHTML = `<div class="sheet tall"><div class="shead"><b>Chọn nhóm</b><button data-x="1">✕</button></div><input id="pc_q" placeholder="Tìm kiếm" autocomplete="off"><div id="pc_l"></div></div>`;
  const row = (c, kid) => `<button type="button" class="crow ${kid ? 'kid' : ''} ${c.id === cur ? 'on' : ''}" data-id="${esc(c.id)}"><span class="ico" style="background:hsl(${hue(c.id)} 65% 50% / .18);width:34px;height:34px;font-size:17px">${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`;
  const draw = q => {
    const n = norm(q); let h = '';
    rootsOf(type).forEach(r => {
      const rm = !n || norm(r.name).includes(n), km = kidsOf(r.id).filter(k => rm || norm(k.name).includes(n));
      if (rm || km.length) h += `<div class="card" style="margin:10px 0 0">${row(r, false)}${km.map(k => row(k, true)).join('')}</div>`;
    });
    o.querySelector('#pc_l').innerHTML = h || '<div class="empty">Không có danh mục</div>';
  };
  o.onclick = e => {
    if (e.target === o || e.target.closest('[data-x]')) return o.remove();
    const b = e.target.closest('.crow'); if (b) { o.remove(); cb(b.dataset.id); }
  };
  o.addEventListener('input', e => { if (e.target.id === 'pc_q') draw(e.target.value); });
  document.body.appendChild(o); draw('');
  setTimeout(() => { const el = o.querySelector('.crow.on'); if (el) el.scrollIntoView({ block: 'center' }); }, 30);
}
function catRow(c, kid) {
  return `<div class="row" data-act="editCat" data-id="${esc(c.id)}" style="padding-left:${kid ? 30 : 0}px;padding-right:0"><div class="ico" style="background:hsl(${hue(c.id)} 65% 50% / .18)">${esc(c.icon)}</div><div class="mid"><b>${esc(c.name)}</b></div><span style="color:var(--muted)">›</span></div>`;
}
function catList() {
  const sec = (t, l) => `<div class="h2" style="padding-left:0">${l}</div>` + rootsOf(t).map(r => catRow(r, false) + kidsOf(r.id).map(k => catRow(k, true)).join('')).join('');

}
function catForm(id) {
  const ex = id && C(id);
  const f = ex ? { ...ex, parentId: ex.parentId || '' } : { name: '', type: 'expense', icon: '📦', parentId: '' };
  const hasKids = !!ex && kidsOf(ex.id).length > 0;

  const draw = () => body.innerHTML = `
    <div class="seg"><button data-t="expense" class="${f.type==='expense'?'on':''}">Chi tiêu</button><button data-t="income" class="${f.type==='income'?'on':''}">Thu nhập</button></div>
    <label>Tên danh mục</label><input id="c_n" value="${esc(f.name)}" placeholder="VD: Cà phê">
    ${hasKids ? '<p class="note">Đây là nhóm chính, đang có danh mục con.</p>' : `<label>Thuộc nhóm</label><select id="c_p"><option value="">— Không (nhóm chính)</option>${rootsOf(f.type).filter(r => !ex || r.id !== ex.id).map(r => `<option value="${esc(r.id)}" ${r.id === f.parentId ? 'selected' : ''}>${esc(r.icon)} ${esc(r.name)}</option>`).join('')}</select>`}

    if (el.id === 's_ok') {
      const url = $('#s_u').value.trim(), key = $('#s_k').value.trim();
      if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(url)) return toast('URL không đúng định dạng Apps Script');
      if (!key) return toast('Nhập mã truy cập');
      el.textContent = 'Đang kết nối…'; el.disabled = true;
      const old = { ...S.cfg }; S.cfg = { url, key };
      try {
        const j = await api('bootstrap');
        save('sc_cfg', S.cfg); S.data = j.data; save('sc_data', S.data); closeSheet(); render(); toast('Kết nối thành công ✓');
      } catch (err) { S.cfg = old; el.textContent = 'Lưu & kết nối'; el.disabled = false; toast(err.message); }
    } else if (el.id === 's_out') {
      if (S.queue.length && !await ask(`Còn ${S.queue.length} thay đổi chưa đồng bộ sẽ bị mất. Tiếp tục?`, 'Ngắt kết nối')) return;
      ['sc_cfg', 'sc_data', 'sc_queue'].forEach(k => { try { localStorage.removeItem(k); } catch (x) {} });
      S.cfg = { url: AUTO_URL, key: '' }; S.data = { wallets: [], categories: [], transactions: [], budgets: [] }; S.queue = [];
      render(); settingsSheet(true);
    }
  };
}
function exportCsv() {
  const rows = [['Ngày', 'Loại', 'Danh mục', 'Ví', 'Ví đến', 'Số tiền', 'Ghi chú']];
  const L = { expense: 'Chi tiêu', income: 'Thu nhập', transfer: 'Chuyển khoản' };
  [...S.data.transactions].sort(sortTx).forEach(t => rows.push([t.date, L[t.type], C(t.categoryId)?.name || '', W(t.walletId)?.name || '', W(t.toWalletId)?.name || '', t.amount, t.note || '']));
  const csv = '﻿' + rows.map(r => r.map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `so-thu-chi-${todayStr()}.csv`; document.body.appendChild(a); a.click(); a.remove();
  toast('Đã xuất CSV');
}

/* ---------- điều phối sự kiện ---------- */
const ACT = {
  tab: el => { S.view = el.dataset.v; S.searchOpen = false; S.q = ''; render(); window.scrollTo(0, 0); },
  addTx: () => txForm(),
  editTx: el => txForm(el.dataset.id),
  mPrev: () => { S.month = shiftMonth(S.month, -1); renderMain(); },
  mNext: () => { S.month = shiftMonth(S.month, 1); renderMain(); },
  mNow: () => { S.month = todayStr().slice(0, 7); renderMain(); },
  pickWallet, setWallet: el => { S.wallet = el.dataset.id; closeSheet(); render(); },
  search: () => { S.searchOpen = !S.searchOpen; if (!S.searchOpen) S.q = ''; renderHeader(); renderMain(); },
  sync: () => configured() ? pull(true) : settingsSheet(true),
  close: closeSheet,
  eye: () => { S.hide = !S.hide; save('sc_hide', S.hide); render(); },
  hpw: el => { S.hpw = el.dataset.v; renderMain(); },
  htp: el => { S.htop = el.dataset.v; renderMain(); },
  hrep: () => { S.hrep = S.hrep === 'expense' ? 'income' : 'expense'; renderMain(); },
  homeRep: () => { S.rp = { type: S.hpw, anchor: todayStr(), from: '', to: '' }; pushPage({ t: 'rep' }); },
  homeTop: () => { S.rp = { type: S.htop, anchor: todayStr(), from: '', to: '' }; pushPage({ t: 'cd', type: 'expense', mode: 'detail' }); },
  pgBack: popPage, pgClose: closePages, rMenu: periodMenu,
  rType: el => {
    closeSheet(); const v = el.dataset.v;
    if (v === 'custom') { S.cust = { from: '', to: '' }; return pushPage({ t: 'cust' }); }
    S.rp = { type: v, anchor: todayStr(), from: '', to: '' }; renderPage();
  },
  rSel: el => { S.rp = { ...S.rp, anchor: el.dataset.a }; renderPage(); },
  cdMode: el => { topPage().mode = el.dataset.v; renderPage(); },
  cmpEye: () => { S.cmpShow = !S.cmpShow; renderPage(); },
  goNet: () => pushPage({ t: 'net' }),
  goCd: el => pushPage({ t: 'cd', type: el.dataset.v, mode: 'detail' }),
  goGrp: () => {
    const r = prange(S.rp), l = rangeTx(r.from, r.to), g = catGroups(l.filter(t => t.type === 'expense'))[0] || catGroups(l.filter(t => t.type === 'income'))[0];
    pushPage({ t: 'grp', cat: g ? g.id : (rootsOf('expense')[0] || {}).id, mode: 'detail' });
  },
  goGrpCat: el => pushPage({ t: 'grp', cat: el.dataset.c, mode: 'detail' }),
  goTxl: el => {
    const d = el.dataset, f = {};
    if (d.type) f.type = d.type;
    if (d.gid !== undefined) f.gid = d.gid;
    if (d.cid !== undefined) f.cid = d.cid;
    if (d.from) { f.from = d.from; f.to = d.to; }
    const title = f.cid !== undefined ? gname(f.cid) : f.gid !== undefined ? gname(f.gid) : (f.from ? (f.from === f.to ? dmy(f.from) : dm(f.from) + ' – ' + dm(f.to)) : 'Giao dịch');
    pushPage({ t: 'txl', title, f });
  },
  grpPick: () => {
    const row = c => `<button class="crow ${c.id === topPage().cat ? 'on' : ''}" data-act="grpSet" data-id="${esc(c.id)}"><span style="font-size:20px">${esc(c.icon)}</span><span>${esc(c.name)}</span></button>`;
    openSheet('Chọn nhóm', `<div class="note" style="margin:0 0 4px">Khoản chi</div>${rootsOf('expense').map(row).join('')}<div class="note">Khoản thu</div>${rootsOf('income').map(row).join('')}`);
  },
  grpSet: el => { topPage().cat = el.dataset.id; closeSheet(); renderPage(); },
  custOk: () => {
    let { from, to } = S.cust; if (!from || !to) return;
    if (to < from) [from, to] = [to, from];
    S.rp = { type: 'custom', anchor: from, from, to }; popPage();
  },
  fmt: () => { FMT = FMT === 'en' ? 'vi' : 'en'; save('sc_fmt', FMT); render(); },
  addWallet: () => walletForm(), editWallet: el => walletForm(el.dataset.id),
  cats: catList, addCat: () => catForm(), editCat: el => catForm(el.dataset.id),
  addBudget: () => budgetForm(), editBudget: el => budgetForm(el.dataset.id),
  export: exportCsv, settings: () => settingsSheet()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el && ACT[el.dataset.act]) ACT[el.dataset.act](el, e); });
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; renderMain(); } });
document.addEventListener('change', e => {
  if (e.target.id === 'cu_f' || e.target.id === 'cu_t') {
    const f = e.target.id === 'cu_f'; S.cust[f ? 'from' : 'to'] = e.target.value;
    const sp = e.target.parentNode.querySelector('span'); sp.textContent = e.target.value ? dmy(e.target.value) : (f ? 'Ngày bắt đầu' : 'Ngày kết thúc'); sp.className = e.target.value ? '' : 'ph';
    const ok = $('[data-act=custOk]'); if (ok) ok.classList.toggle('off', !(S.cust.from && S.cust.to));
  }
});

/* ---------- khởi động ---------- */
render();
if (!configured()) settingsSheet(true); else pull();
addEventListener('online', flush);
document.addEventListener('visibilitychange', () => { if (!document.hidden && configured()) pull(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !/googleusercontent|script\.google/.test(location.host)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
